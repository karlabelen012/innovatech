# ===================================================
# BFF - Innovatech Solutions
# Backend for Frontend — puerto 8080
# ===================================================
spring.application.name=bff-innovatech
server.port=8080

# ===================================================
# URLs de los microservicios
# ===================================================
ms.proyectos.url=http://localhost:8081
ms.recursos.url=http://localhost:8084
ms.analitica.url=http://localhost:8083
ms.mensajeria.url=http://localhost:8085

# ===================================================
# RestTemplate timeouts
# ===================================================
app.rest.connect-timeout=5000
app.rest.read-timeout=10000

# ===================================================
# Resilience4j - Circuit Breaker
# Si un microservicio cae, su circuito se abre (OPEN) y las llamadas
# fallan rápido (sin esperar el timeout) sin afectar a los demás servicios.
# ===================================================
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=5
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
# RecursoNoEncontradoException se excluye del conteo de fallos vía ResilienceConfig (CircuitBreakerConfigCustomizer)

resilience4j.circuitbreaker.instances.msProyectos.base-config=default
resilience4j.circuitbreaker.instances.msRecursos.base-config=default
resilience4j.circuitbreaker.instances.msAnalitica.base-config=default
resilience4j.circuitbreaker.instances.msMensajeria.base-config=default

# ===================================================
# Swagger / OpenAPI
# ===================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.info.title=BFF Innovatech Solutions
springdoc.info.description=Backend for Frontend — punto único de entrada hacia los microservicios
springdoc.info.version=1.0.0

# ===================================================
# CORS
# ===================================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ===================================================
# Seguridad JWT
# El BFF actua como gateway de seguridad: protege /api/bff/** con JWT.
# Los microservicios internos confian en la red interna de Docker.
# ===================================================
app.jwt.secret=${JWT_SECRET:innovatech-solutions-clave-secreta-desarrollo-cambiar-en-produccion-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ===================================================
# Logging
# ===================================================
logging.level.cl.duoc.innovatech=DEBUG
logging.level.org.springframework.web.client=DEBUG
